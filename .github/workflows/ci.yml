name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Electron project
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: algo-electron

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: algo-electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run automated validation
        run: npm run test:all

  packaged-main:
    name: Build packaged main process
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: algo-electron

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: algo-electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and inspect packaged main process
        run: npm run build:check
