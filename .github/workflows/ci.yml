name: CI

on:
  workflow_dispatch:
    inputs:
      installer_acceptance:
        description: Run actual NSIS upgrade/recovery/uninstall acceptance on a fresh hosted Windows VM
        type: boolean
        required: false
        default: false
  pull_request:
  push:
    branches:
      - master
      - dev

permissions:
  contents: read

env:
  CI: "true"
  npm_config_audit: "false"
  npm_config_fund: "false"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-guard:
    name: Fast core, packaging and docs guard
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: algo-electron

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: algo-electron/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: algo-electron/pnpm-lock.yaml

      - name: Restore Electron downloads
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\electron\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('algo-electron/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run core guard
        run: pnpm run test:core

      - name: Check packaging security configuration
        run: pnpm run test:packaging

      - name: Check documentation links and coverage
        run: pnpm run test:docs

  renderer-smoke:
    name: Electron and renderer smoke
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: algo-electron

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: algo-electron/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: algo-electron/pnpm-lock.yaml

      - name: Restore Electron downloads
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\electron\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('algo-electron/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Electron startup smoke
        run: pnpm run test:electron

      - name: Run renderer interaction and screenshots
        run: pnpm run test:ui

  validate:
    name: Full validation (manual)
    if: github.event_name == 'workflow_dispatch' && !inputs.installer_acceptance
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: algo-electron

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: algo-electron/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: algo-electron/pnpm-lock.yaml

      - name: Restore Electron downloads
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\electron\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('algo-electron/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run automated validation
        run: pnpm run test:all

  packaged-smoke:
    name: Build and smoke test packaged app (manual)
    if: github.event_name == 'workflow_dispatch' && !inputs.installer_acceptance
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: algo-electron

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: algo-electron/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: algo-electron/pnpm-lock.yaml

      - name: Restore Electron downloads
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\electron\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('algo-electron/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Restore electron-builder tools
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('algo-electron/pnpm-lock.yaml', 'algo-electron/electron-builder.json5') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and inspect packaged main process
        run: pnpm run build:check

      - name: Build unpacked Windows application
        run: pnpm exec electron-builder --win --dir --publish never

      - name: Smoke test unpacked Windows application
        run: pnpm run test:packaged-app

  installer-acceptance:
    name: Isolated NSIS upgrade and recovery (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.installer_acceptance
    needs: [fast-guard, renderer-smoke]
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: algo-electron

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: algo-electron/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: algo-electron/pnpm-lock.yaml

      - name: Restore Electron downloads
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\electron\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('algo-electron/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Restore electron-builder tools
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('algo-electron/pnpm-lock.yaml', 'algo-electron/electron-builder.json5') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build candidate without publishing
        run: pnpm run build:win

      - name: Prepare exact shipped baseline and fresh candidate inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/packaging/prepare-installer-acceptance.mjs

      - name: Exercise actual current-user installation lifecycle
        shell: powershell
        env:
          INSTALLER_INPUT: ${{ steps.inputs.outputs.inputDirectory }}
          INSTALLER_OUTPUT: ${{ steps.inputs.outputs.outputDirectory }}
        run: |
          & (Join-Path $env:INSTALLER_INPUT 'sandbox-upgrade-guest.ps1') -Environment GitHubActions -InputRoot $env:INSTALLER_INPUT -OutputRoot $env:INSTALLER_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain synthetic acceptance summary only
        if: always() && steps.inputs.outputs.outputDirectory != ''
        uses: actions/upload-artifact@v7
        with:
          name: installer-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ steps.inputs.outputs.outputDirectory }}/report.json
            ${{ steps.inputs.outputs.inputDirectory }}/input-manifest.json
            ${{ steps.inputs.outputs.runDirectory }}/engineering-build.json
          if-no-files-found: error
          retention-days: 14
